name: Build Windows receiver
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Check release identity
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $expected = 'windows-v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must be $expected" }
      - name: Publish portable receiver
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-receiver-x64
          path: |
            dist/WiiU-Controller-Windows-x64.zip
            dist/Windows-SHA256SUMS.txt
          if-no-files-found: error
  release:
    name: Publish Windows release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/windows-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-receiver-x64
          path: windows-assets
      - name: Publish Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" windows-assets/* \
            --verify-tag --title "Windows PC Receiver ${GITHUB_REF_NAME#windows-}" \
            --notes-file windows/RELEASE_NOTES.md --latest=false
